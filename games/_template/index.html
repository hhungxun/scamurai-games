<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scam or Not?</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:2rem auto;padding:0 16px;text-align:center}button{font-size:1.1rem;margin:.5rem;padding:.6rem 1.2rem}</style>
</head><body>
<h1>Scam or Not?</h1>
<p id="q"></p><button onclick="answer(true)">Scam</button><button onclick="answer(false)">Legit</button>
<p id="r"></p><p><a href="../../">← all games</a></p>
<script>
const qs=[["\"Your parcel is held. Pay RM2.50 at bit.ly/xx to release it.\"",true],["Your bank app shows a login alert you just triggered yourself.",false],["\"Police here. Transfer your savings to a safe account now.\"",true]];
let i=0,score=0;const show=()=>{document.getElementById('q').textContent=i<qs.length?qs[i][0]:`Done! ${score}/${qs.length}`};
function answer(a){if(i>=qs.length)return;const ok=a===qs[i][1];if(ok)score++;document.getElementById('r').textContent=ok?'✅ Correct':'❌ Not quite';i++;show()}
show();
</script></body></html>
