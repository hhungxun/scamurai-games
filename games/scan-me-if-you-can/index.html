<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Station 5 · Scan Me If You Can</title>
<link rel="stylesheet" href="s5.css">
<style>
  .dash{max-width:1300px;margin:0 auto;padding:18px 22px}
  .top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
  .acts{display:flex;gap:10px;flex-wrap:wrap}
  .btn{background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:600 17px Lexend,sans-serif;cursor:pointer}
  .ghost{background:transparent;border:2px solid var(--dim);color:var(--grey);font:15px Lexend,sans-serif;border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none}
  .ghost.sm{padding:5px 9px;font-size:13px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .tile{background:var(--surf);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .tile .who{display:flex;justify-content:space-between;align-items:start;gap:8px}
  .tile .who b{font-size:18px}
  .tile .pts{font:400 44px/1 Anton,Impact,sans-serif;color:var(--yellow);text-align:right}
  .strip{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
  .strip span{background:#1d1c1b;border-radius:6px;text-align:center;font:600 13px Lexend,sans-serif;padding:6px 0;color:var(--grey)}
  .strip .ok{background:#1f5a32;color:#fff}.strip .no{background:#6a1414;color:#fff}
  .tile .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tile.over{outline:2px solid var(--yellow)}
  .tile.dead{opacity:.6}
  .tile .err{color:#ff6b6b;font-weight:600}
  .banner{background:var(--red);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px}
  .empty{color:var(--grey);text-align:center;padding:60px 20px;border:2px dashed var(--dim);border-radius:16px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;z-index:50;padding:16px}
  .modal .card{background:var(--bg);border-radius:18px;padding:20px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px}
  .qr{background:#fff;border-radius:16px;padding:14px;display:grid;place-items:center}
  .qr svg{width:100%;height:auto;max-width:400px}
  ol.how{margin:0;padding-left:20px}ol.how li{margin:4px 0}
  details.sum summary{cursor:pointer;color:var(--grey)}
</style>
<script src="/sdk.js" data-station="5"></script>
<script src="cards/manifest.js"></script>
<script src="sim-browser.js"></script>
<script src="/vendor/qrcode.js"></script>
<script src="s5.js"></script>
<script src="/site.js" defer></script><link rel="stylesheet" href="../shared/theme.css"></head><body data-site-nav data-game="scan">
<main class="dash" id="app"><p class="muted">Loading…</p></main>
<div id="modal"></div>
<script>
/* Station 5 laptop: a Game Master dashboard for many Participants at once.
 * "+ New player" opens the SDK picker; each Round gets its own deal (8 random board numbers,
 * 3 Real + 5 Fake cards behind them), posted to the Round as { t:'deal', cards:{n:slug}, order:[n…] }.
 * The phone reads the deal, so a board number means a different card every Round.
 * One poll loop reads every open Round's events and scores the Verdicts. Reloading the page,
 * or opening it on a second laptop, rebuilds the tiles from the server's open Rounds. */
const REAL = 3, FAKE = 5, N = REAL + FAKE, MAX = N * 100;
const app = document.getElementById('app'), modal = document.getElementById('modal');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const dir = location.pathname.replace(/[^/]*$/, '');
const joinUrl = R => `${location.origin}${dir}phone.html#${R.roundId}.${R.token}`;
const hdr = R => ({ 'Content-Type': 'application/json', 'X-Round-Token': R.token });

let CARDS = {};          // slug -> card (real, brand, …)
const rounds = new Map(); // roundId -> Round state
window.S5_ROUNDS = rounds; window.S5_JOIN = null;   // for tests without a camera

function newDeal() {
  const slugs = Object.keys(CARDS);
  const pick = shuffle([...shuffle(slugs.filter(s => CARDS[s].real)).slice(0, REAL), ...shuffle(slugs.filter(s => !CARDS[s].real)).slice(0, FAKE)]);
  const pos = shuffle(CARD_MANIFEST.map(m => m.id)).slice(0, N);
  return { t: 'deal', cards: Object.fromEntries(pos.map((n, i) => [n, pick[i]])), order: pos };
}

// A Round as the dashboard tracks it. deal stays null until the server echoes a deal event back,
// so two laptops that both deal the same Round end up using the same (first) one, as the phone does.
function track({ roundId, token, startedAt, participant }) {
  if (rounds.has(roundId)) return rounds.get(roundId);
  const R = { roundId, token, startedAt, p: participant, deal: null, order: [], got: {}, joined: false, devs: new Set(), lastId: 0,
    posted: false, state: 'open', result: null, finishing: false };
  rounds.set(roundId, R);
  return R;
}

async function postDeal(R) {
  if (R.posted) return; R.posted = true;
  try {
    const res = await fetch(`/api/rounds/${R.roundId}/events`, { method: 'POST', headers: hdr(R), body: JSON.stringify({ data: newDeal() }) });
    if (!res.ok && res.status !== 409 && res.status !== 403) R.posted = false;   // 5xx/429: deal again on the next poll
  } catch { R.posted = false; }
}

async function pollRound(R) {
  if (R.state !== 'open') return;
  let j;
  try {
    const res = await fetch(`/api/rounds/${R.roundId}/events?after=${R.lastId}`, { headers: { 'X-Round-Token': R.token } });
    if (res.status === 403 || res.status === 404) { R.state = 'gone'; return; }
    j = await res.json();
  } catch { R.offline = true; return; }
  R.offline = false;
  for (const e of j.events || []) {
    R.lastId = Math.max(R.lastId, e.id);
    const d = e.data || {};
    if (d.t === 'deal' && !R.deal) { R.deal = d.cards; R.order = (d.order || Object.keys(d.cards)).map(Number); }
    if (d.t === 'join') R.joined = true;
    if ((d.t === 'join' || d.t === 'v') && d.dev) R.devs.add(d.dev);
    if (d.t === 'v' && R.deal && R.deal[d.n] && !R.got[d.n]) {
      R.joined = true;
      const card = CARDS[R.deal[d.n]];
      if (!card) { R.err = `Card ${R.deal[d.n]} is not loaded on this laptop. Reload the page.`; continue; }
      const ms = Math.max(0, Math.min(S5.SECS * 1000, +d.ms || 0));
      const v = ['real', 'fake'].includes(d.v) ? d.v : 'timeout';
      const correct = v !== 'timeout' && (v === 'real') === card.real;
      R.got[d.n] = { v, ms, correct, pts: S5.points(correct, ms, v) };
    }
  }
  if (!R.deal && !(j.events || []).length && R.lastId === 0 && Object.keys(CARDS).length) postDeal(R);   // nobody has dealt this Round yet
  if (j.cancelled) R.state = 'cancelled';
  else if (j.ended) { R.state = 'ended'; fetchResult(R); }
  else if (R.deal && Object.keys(R.got).length === N && !R.finishing) { R.finishing = true; setTimeout(() => end(R), 2500); }
  if (R.joined && modal.dataset.round == R.roundId) closeModal();
}

const score = R => S5.total(Object.values(R.got));

async function end(R) {
  if (R.state !== 'open' && R.state !== 'ending') return;
  R.state = 'ending'; draw();
  try {
    R.result = await Scamurai.finishRound(R.roundId, { score: score(R), maxScore: MAX });
    R.state = 'ended';
  } catch (e) {
    if (e.status === 409) R.state = 'cancelled';
    else { R.state = 'open'; R.finishing = false; R.err = 'Could not save: ' + e.message; }
  }
  draw();
}
// Ended on another laptop: finish is idempotent, so asking again returns the stored result.
async function fetchResult(R) { if (!R.result) try { R.result = await Scamurai.finishRound(R.roundId, { score: score(R), maxScore: MAX }); draw(); } catch {} }

async function cancel(R) {
  if (!confirm(`Cancel ${R.p.name}'s round? It won't count, and they can start again.`)) return;
  try { await Scamurai.cancelRound(R.roundId); R.state = 'cancelled'; } catch (e) { if (e.status === 409) R.state = 'ended'; else alert(e.message); }
  draw();
}

function showQR(R) {
  const q = qrcode(0, 'M'); q.addData(joinUrl(R)); q.make();
  window.S5_JOIN = joinUrl(R);
  modal.dataset.round = R.roundId;
  modal.innerHTML = `<div class="modal"><div class="card">
    <div class="head"><img class="logo" src="/assets/logo.jpg" alt=""><div><h1>Scan Me <em>If You Can</em></h1><p class="tag">${esc(R.p.name)} · ${esc(R.p.id)}</p></div></div>
    <div class="qr">${q.createSvgTag({ cellSize: 8, margin: 2, scalable: true })}</div>
    <div class="box"><b>${esc(R.p.name)}: scan this with your phone camera</b>
      <ol class="how"><li>Allow camera access on your phone. It shows a QR number.</li><li>Find it on the board and scan it with the in-game scanner.</li>
      <li>${S5.SECS} seconds per site: explore it, then tap <b>REAL</b> or <b>FAKE</b>.</li><li>Only the first site has a Start timer button. Later scans start the clock immediately.</li><li>8 sites. Right and fast = more points. A wrong call costs 100, so don't guess.</li></ol></div>
    <button class="ghost" id="mclose">Close (the QR stays on ${esc(R.p.name)}'s tile)</button></div></div>`;
  document.getElementById('mclose').onclick = closeModal;
}
function closeModal() { modal.innerHTML = ''; delete modal.dataset.round; }

function tile(R) {
  const n = Object.keys(R.got).length;
  const strip = R.order.map(b => { const g = R.got[b]; return `<span class="${g ? (g.correct ? 'ok' : 'no') : ''}" title="${g ? esc(CARDS[R.deal[b]]?.brand) : ''}">${b}</span>`; }).join('')
    || Array(N).fill('<span>·</span>').join('');
  let status, btns;
  if (R.state === 'open' || R.state === 'ending') {
    status = R.err ? `<span class="err">${esc(R.err)}</span>` : R.offline ? 'Reconnecting…' : !R.deal ? 'Dealing…' : !R.joined ? 'Waiting for the phone to join' : `${n} of ${N} judged`;
    if (R.devs.size > 1) status += ` · <b style="color:var(--red)">${R.devs.size} phones joined this round</b>`;
    status += ` · <span class="el" data-t="${R.startedAt}"></span>`;
    btns = `<button class="ghost sm" data-a="qr">Join QR</button><button class="ghost sm" data-a="end">End now</button><button class="ghost sm" data-a="cancel">Cancel</button>`;
  } else if (R.state === 'ended') {
    const r = R.result;
    status = r ? `<b style="color:var(--yellow)">${r.pct}%</b> · best here ${r.best}% · ${r.stationsDone.length}/5 stations${r.already ? ' · ended on another laptop' : ''}` : 'Round over';
    btns = (r && r.surveyDue ? `<button class="btn" data-a="survey">Exit survey</button>` : '') + `<button class="ghost sm" data-a="dismiss">Dismiss</button>`;
  } else {
    status = R.state === 'cancelled' ? 'Cancelled (doesn’t count)' : 'Round not found';
    btns = `<button class="ghost sm" data-a="dismiss">Dismiss</button>`;
  }
  const detail = n ? `<details class="sum"><summary>Answers</summary>${R.order.filter(b => R.got[b]).map(b => {
    const g = R.got[b], c = CARDS[R.deal[b]] || { brand: R.deal[b] };
    return `<div><small>#${b} ${esc(c.brand)} · <b>${c.real ? 'REAL' : 'FAKE'}</b> · ${g.v === 'timeout' ? 'time ran out' : 'said ' + g.v.toUpperCase()} · ${(g.ms / 1000).toFixed(1)}s · +${g.pts}</small></div>`; }).join('')}</details>` : '';
  return `<div class="tile ${R.state === 'ended' ? 'over' : R.state === 'cancelled' || R.state === 'gone' ? 'dead' : ''}" data-id="${R.roundId}">
    <div class="who"><div><b>${esc(R.p.name)}</b><br><small class="muted">${esc(R.p.id)} · round ${R.roundId}</small></div><div class="pts">${score(R)}</div></div>
    <div class="strip">${strip}</div><div class="muted">${status}</div>${detail}<div class="row">${btns}</div></div>`;
}

// Only tiles whose content changed are replaced, so a button under the mouse isn't swapped out mid-click.
function draw() {
  const all = [...rounds.values()];
  const t = document.getElementById('tiles'); if (!t) return;
  if (!all.length) { t.innerHTML = `<div class="empty">No one is playing. Press <b>+ New player</b>.</div>`; }
  else {
    t.querySelector('.empty')?.remove();
    t.querySelectorAll('.tile').forEach(el => { if (!rounds.has(+el.dataset.id)) el.remove(); });
    for (const R of all) {
      const html = tile(R);
      let el = t.querySelector(`.tile[data-id="${R.roundId}"]`);
      if (el && el._html === html) continue;
      const wasOpen = el?.querySelector('details')?.open;
      const tmp = document.createElement('div'); tmp.innerHTML = html; const nu = tmp.firstElementChild; nu._html = html;
      if (wasOpen && nu.querySelector('details')) nu.querySelector('details').open = true;
      el ? el.replaceWith(nu) : t.appendChild(nu);
    }
  }
  tick();
  document.getElementById('count').textContent = all.filter(R => R.state === 'open').length;
}
function tick() {
  document.querySelectorAll('.el[data-t]').forEach(e => { const s = Math.max(0, Math.round((Date.now() - +e.dataset.t) / 1000)); e.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; });
}

async function newPlayer() {
  if (!Object.keys(CARDS).length) return alert('The Site Cards have not loaded yet. Check the Wi-Fi and reload this page.');
  const p = await Scamurai.pick();
  if (!p) return;
  const R = track({ roundId: p.roundId, token: p.token, startedAt: p.startedAt, participant: { id: p.id, name: p.name } });
  if (!p.existing) await postDeal(R);   // an already open Round keeps its deal; pollRound deals if it has none
  showQR(R); draw(); pollRound(R).then(draw);
}

async function syncOpen() {
  try { for (const o of await Scamurai.openRounds()) if (!rounds.has(o.roundId)) track(o); } catch {}
}

Scamurai.onDashboard(async ({ stationName }) => {
  app.innerHTML = `<div class="top">
      <div class="head"><img class="logo" src="/assets/logo.jpg" alt=""><div><h1>Scan Me <em>If You Can</em></h1><p class="tag">${esc(stationName || 'Station 5')} · <span id="count">0</span> playing</p></div></div>
      <div class="acts"><button class="btn" id="new">+ New player</button><button class="ghost" id="leave">Leaving</button><a class="ghost" href="board.html" target="_blank">Board QRs</a></div>
    </div><div class="tiles" id="tiles"></div>`;
  document.getElementById('new').onclick = newPlayer;
  // One card failing to load (booth Wi-Fi) must not leave the dashboard dead: retry it, deal from the rest, and say so.
  const loadCard = async m => { for (let i = 0; ; i++) try { return [m.slug, await SimCards.load(m.slug)]; } catch (e) {
    if (i === 2) throw e; document.querySelectorAll(`script[src*="${m.file}"]`).forEach(x => x.remove()); await new Promise(r => setTimeout(r, 1000)); } };
  const got = await Promise.allSettled(CARD_MANIFEST.map(loadCard));
  CARDS = Object.fromEntries(got.filter(x => x.status === 'fulfilled').map(x => x.value));
  const missing = CARD_MANIFEST.filter((m, i) => got[i].status === 'rejected');
  const realN = Object.values(CARDS).filter(c => c.real).length, fakeN = Object.keys(CARDS).length - realN;
  if (missing.length) app.insertAdjacentHTML('afterbegin', `<div class="banner">${missing.length} Site Card(s) did not load (${missing.map(m => esc(m.slug)).join(', ')}).
    ${realN < REAL || fakeN < FAKE ? '<b>Not enough cards to deal a round. Reload this page.</b>' : 'Rounds are dealt from the others; reload when the Wi-Fi is back.'}</div>`);
  if (realN < REAL || fakeN < FAKE) CARDS = {};
  document.getElementById('leave').onclick = () => Scamurai.leaving();
  document.getElementById('tiles').onclick = e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const R = rounds.get(+b.closest('.tile').dataset.id); if (!R) return;
    ({ qr: () => showQR(R),
       end: () => confirm(`End ${R.p.name}'s round now? Unjudged sites score 0.`) && end(R),
       cancel: () => cancel(R),
       survey: () => Scamurai.survey({ id: R.p.id, name: R.p.name }, R.result.stationsDone),
       dismiss: () => { rounds.delete(R.roundId); draw(); } })[b.dataset.a]();
  };
  await syncOpen(); draw();
  let busy = false;
  setInterval(async () => {
    if (busy) return; busy = true;
    try { await Promise.all([...rounds.values()].map(pollRound)); draw(); } finally { busy = false; }
  }, 1500);
  setInterval(syncOpen, 8000);
  setInterval(tick, 1000);
});
</script>
</body></html>
