<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Station 5 · QR board (print)</title>
<link rel="stylesheet" href="/style.css">
<style>
  @page{size:A4;margin:10mm}
  body{color-scheme:light;margin:0;font-family:Lexend,sans-serif;background:#fff;color:#171616}
  .bar{padding:12px 16px;background:#171616;color:#fff;font-size:14px}
  .bar input{width:min(520px,90vw);font:inherit;padding:6px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8mm;padding:8mm}
  .q{border:2px dashed #999;border-radius:6mm;padding:5mm;text-align:center;break-inside:avoid;page-break-inside:avoid;height:84mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
  .q .n{font:400 18mm/1 Anton,Impact,sans-serif;color:#F00303}
  .q svg{width:56mm;height:56mm}
  .q small{font-size:3mm;color:#5C5A58}
  @media print{.bar{display:none}.grid{padding:0}}
</style>
<script src="cards/manifest.js"></script>
<script src="/vendor/qrcode.js"></script>
</head><body>
<div class="bar"><a href="/" style="color:white">Scamurai home</a><p>Print this page (A4, 6 per page) and cut along the dashes. Codes point to:</p>
  <input id="base" aria-label="Board QR destination"> <button onclick="draw()">Redraw codes</button><p id="qrError" role="alert" style="color:#ffaaa2"></p></div>
<div class="grid" id="grid"></div>
<script>
// Each code opens c.html?n=<board number>. The card behind each number is dealt fresh every Round.
const base = document.getElementById('base');
base.value = (location.protocol === 'file:' || ['localhost','127.0.0.1'].includes(location.hostname) ? 'https://scamurai.physicsxmum.my/games/scan-me-if-you-can/' : location.href.replace(/[^/]*([?#].*)?$/, '')) + 'c.html?n=';
function draw() {
  let destination;
  try { destination = new URL(base.value); if (!['https:', 'http:'].includes(destination.protocol) || destination.pathname !== '/games/scan-me-if-you-can/c.html' || !destination.searchParams.has('n') || destination.searchParams.get('n') !== '') throw new Error(); }
  catch { document.getElementById('qrError').textContent = 'Use a valid board address ending in /games/scan-me-if-you-can/c.html?n='; document.getElementById('grid').innerHTML = ''; return; }
  document.getElementById('qrError').textContent = '';
  document.getElementById('grid').innerHTML = CARD_MANIFEST.map(m => {
    const q = qrcode(0, 'M'); destination.searchParams.set('n', m.id); q.addData(destination.href); q.make();
    return `<div class="q"><div class="n">#${m.id}</div>${q.createSvgTag({ cellSize: 6, margin: 1, scalable: true })}<small>Scamurai · Scan Me If You Can</small></div>`;
  }).join('');
}
draw();
</script>
</body></html>
