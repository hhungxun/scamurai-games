<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Scan Me If You Can</title>
<link rel="stylesheet" href="s5.css">
<style>
  /* The Verdict bar: translucent so the site stays visible behind it */
  .vbar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:40;padding:8px 10px;
    background:rgba(23,22,22,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;gap:10px;align-items:center}
  .vbar button{flex:1;font:400 24px Anton,Impact,sans-serif;letter-spacing:1px;border:0;border-radius:12px;padding:12px 0;color:#fff;opacity:.92}
  .vbar .real{background:rgba(31,122,58,.9)}.vbar .fake{background:rgba(240,3,3,.9)}
  .vbar .t{width:54px;height:54px;flex:none;border-radius:50%;display:grid;place-items:center;font:22px Anton,sans-serif;color:#fff;
    background:conic-gradient(var(--yellow) calc(var(--p)*1turn),rgba(255,255,255,.18) 0)}
  .vbar .t b{width:44px;height:44px;border-radius:50%;background:rgba(23,22,22,.85);display:grid;place-items:center;font-weight:400}
  .vbar .t.low{background:conic-gradient(var(--red) calc(var(--p)*1turn),rgba(255,255,255,.18) 0)}
  .res{position:fixed;inset:0;z-index:50;background:rgba(23,22,22,.94);overflow:auto}
</style>
<script src="cards/manifest.js"></script>
<script src="sim-browser.js"></script>
<script src="s5.js"></script>
<script src="/vendor/jsQR.js"></script>
<script src="/qr-scanner.js"></script>
<script src="scanner.js"></script>
<link rel="stylesheet" href="../shared/theme.css"><link rel="icon" href="/assets/favicon.png" type="image/png"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"></head><body data-game="scan">
<nav class="game-scores" aria-label="Participant navigation"><a class="game-home" href="/">Home</a><a class="scores-link" href="/participant.html?from=station5">My scores</a></nav>
<main class="s5" id="app"></main>
<div id="sim"></div>
<script>
const app = document.getElementById('app'), sim = document.getElementById('sim');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const H = `<div class="head"><img class="logo" src="/assets/logo.jpg" alt=""><div><h1>Scan Me <em>If You Can</em></h1><p class="tag">Station 5 · Scamurai</p></div></div>`;
// The in-game scanner records later cards' start times before navigating here.
const bn = Number(new URLSearchParams(location.search).get('n'));
const r = S5.get();
const say = html => { app.innerHTML = H + html; };
const back = '<p><a href="phone.html" style="color:var(--yellow)">Back to the QR scanner</a></p>';
S5.flush(r);

if (!Number.isInteger(bn) || bn < 1 || bn > 25) say(`<div class="box">Unknown QR code.${back}</div>`);
else if (!r || !r.deal) say(`<div class="box">This is QR <b>#${bn}</b>. First scan the <b>Join QR</b> on the Station 5 laptop.${back}</div>`);
else {
  const error = S5.scan(r, bn);
  if (error) say(`<div class="box">${esc(error)}${back}</div>`);
  else play();
}

function play() {
  const slug = r.deal[bn];
  const current = () => { const cur = S5.get(); return cur && cur.id === r.id ? cur : null; };
  const startedAt = () => ((current() || r).started || {})[bn];
  const leftAt = () => startedAt() ? Math.max(0, S5.SECS - (Date.now() - startedAt()) / 1000) : S5.SECS;
  let card = null, browser = null, bar = null, tick = null, over = false, scanner = null;
  let onPop = null;
  const automatic = !!startedAt();            // clock already running (reload mid-card)
  const later = r.firstCard !== bn;           // later cards start themselves once the site is usable
  say(`<div class="box" style="text-align:center"><div class="big">#${bn}</div>
    <p>Is this site <b>REAL</b> or <b>FAKE</b>?</p>
    <p class="muted">${automatic ? 'Your 12 seconds are already running.' : later ? 'You get 12 seconds. The timer starts when the site has finished loading.' : 'You get 12 seconds. Tap Start timer when you are ready.'}</p></div>
    <button class="btn" id="go" disabled>Loading the site…</button><p class="muted" id="lerr" style="text-align:center"></p>`);
  const go = document.getElementById('go'), lerr = document.getElementById('lerr');
  // Server checks never hold up a running clock, even on poor Wi-Fi.
  S5.ended(r).then(ended => {
    if (!ended || over) return;
    over = true; cleanup(); bar?.remove(); browser?.close();
    if (ended === 'gone' && current()) { try { localStorage.removeItem(S5.KEY); } catch {} }
    say(`<div class="box">This round has ${ended === 'cancelled' ? 'been cancelled' : 'ended'} at the laptop. You can still view your scores below. Ask the Game Master for a new Join QR to play again.</div>`);
  });

  function cleanup() {
    clearInterval(tick);
    if (onPop) removeEventListener('popstate', onPop);
  }
  function clock() {
    if (bar || over) return;
    bar = document.createElement('div'); bar.className = 'vbar';
    bar.innerHTML = `<button class="real" disabled>REAL</button><div class="t"><b>${S5.SECS}</b></div><button class="fake" disabled>FAKE</button>`;
    document.body.appendChild(bar);
    const ring = bar.querySelector('.t'), num = ring.querySelector('b');
    const draw = () => {
      const left = leftAt();
      ring.style.setProperty('--p', left / S5.SECS); num.textContent = Math.ceil(left);
      ring.classList.toggle('low', left <= 3);
      if (left <= 0) verdict('timeout');
    };
    bar.querySelector('.real').onclick = () => verdict('real');
    bar.querySelector('.fake').onclick = () => verdict('fake');
    tick = setInterval(draw, 100); draw();
  }
  function showSite() {
    if (over || !card) return;
    app.innerHTML = '';
    browser = SimBrowser(sim, card, { bottomInset: 140, onReady: () => {
      if (over) return;
      stamp(); clock();
      if (leftAt() <= 0) return verdict('timeout');
      bar.querySelectorAll('button').forEach(b => b.disabled = false);
    } });
    history.pushState({ s5: 1 }, '');
    onPop = () => { if (over) return; history.pushState({ s5: 1 }, ''); browser?.back(); };
    addEventListener('popstate', onPop);
  }
  function stamp() {
    if (startedAt()) return;
    const cur = current();
    if (!cur) return;
    cur.started = { ...(cur.started || {}), [bn]: Date.now() };
    S5.save(cur); r.started = cur.started;
  }
  function start() {
    if (over) return;
    stamp(); clock(); showSite();
  }
  async function prepare() {
    if (over) return;
    go.disabled = true; go.textContent = 'Loading the site…'; lerr.textContent = '';
    try { card = await SimCards.load(slug); await SimCards.prefetch(card); }
    catch (e) {
      if (over) return;
      go.disabled = false; go.textContent = 'Retry loading'; go.onclick = prepare;
      lerr.textContent = `Could not load this site. Check your internet. Your timer has not started.`;
      return;
    }
    if (over) return;
    if (startedAt() || later) return showSite();   // timer starts in onReady, after the first frame loads
    go.disabled = false; go.textContent = 'Start timer'; go.onclick = start;
  }
  // A card already stamped (reload) resumes its running clock at once; otherwise the clock waits for the site.
  if (automatic) clock();
  if (!over) prepare();

  async function verdict(v) {
    if (over) return;
    // A tap after the deadline is a timeout even if the browser throttled its draw loop.
    if (leftAt() <= 0) v = 'timeout';
    over = true; cleanup();
    const cur = current();
    if (!cur) { bar?.remove(); browser?.close(); return say(`<div class="box">This phone has switched rounds.${back}</div>`); }
    const ms = Math.min(S5.SECS * 1000, Math.max(0, Date.now() - (startedAt() || Date.now())));
    const correct = v !== 'timeout' && card && (v === 'real') === card.real;
    const pts = S5.points(correct, ms, v);
    cur.done[bn] = { v, ms, correct: !!correct, pts, sent: false };
    S5.save(cur);
    bar?.remove(); browser?.close();
    const sent = S5.send(cur, bn);
    const next = S5.next(cur);
    const res = document.createElement('div'); res.className = 'res';
    res.innerHTML = `<main class="s5">${H}
      <div class="box" style="text-align:center">
        <div class="big" style="color:${correct ? 'var(--game-green)' : 'var(--red)'}">${correct ? '✓ +' + pts : v === 'timeout' ? "Time's up · 0" : '✗ ' + pts}</div>
        ${card ? `<p>It was <b style="color:${card.real ? 'var(--game-green)' : 'var(--red)'}">${card.real ? 'REAL' : 'FAKE'}</b> · ${esc(card.brand)}</p><p class="muted" style="word-break:break-all">${esc(card.url)}</p>` : '<p>The site did not load before time ran out.</p>'}</div>
      ${next ? '<div id="scanner"></div>' : '<div class="box">All done! Tap <b>My scores</b> to see your total and each QR result.</div>'}
      ${card ? `<div class="box"><b>${card.real ? 'Why it is genuine' : !correct ? 'What you missed' : 'The tells'}</b><ul class="tells">${(card.tells || []).map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}
      <p class="muted" id="sent" style="text-align:center">Saving…</p></main>`;
    document.body.appendChild(res);
    if (next) { S5.warm(cur); scanner = S5Scanner.mount(document.getElementById('scanner')); }
    const st = await sent;
    document.getElementById('sent').textContent = st === 'ok' ? 'Saved to the laptop ✓'
      : st === 'over' ? 'Not counted: this round has already ended at the laptop.'
      : 'No connection yet. Keep going: your answer is kept on this phone and sent with the next scan.';
    if (st === 'over') scanner?.stop();
  }
  addEventListener('pagehide', () => { cleanup(); scanner?.stop(); });
}
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

</script>
</body></html>
