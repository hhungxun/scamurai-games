<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Scan Me If You Can</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Lexend:wght@400;600&family=Permanent+Marker&display=swap">
<link rel="stylesheet" href="s5.css">
<style>
  /* The Verdict bar: translucent so the site stays visible behind it */
  .vbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px 10px calc(10px + env(safe-area-inset-bottom));
    background:rgba(23,22,22,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;gap:10px;align-items:center}
  .vbar button{flex:1;font:400 24px Anton,Impact,sans-serif;letter-spacing:1px;border:0;border-radius:12px;padding:12px 0;color:#fff;opacity:.92}
  .vbar .real{background:rgba(31,122,58,.9)}.vbar .fake{background:rgba(240,3,3,.9)}
  .vbar .t{width:54px;height:54px;flex:none;border-radius:50%;display:grid;place-items:center;font:22px Anton,sans-serif;color:#fff;
    background:conic-gradient(var(--yellow) calc(var(--p)*1turn),rgba(255,255,255,.18) 0)}
  .vbar .t b{width:44px;height:44px;border-radius:50%;background:rgba(23,22,22,.85);display:grid;place-items:center;font-weight:400}
  .vbar .t.low{background:conic-gradient(var(--red) calc(var(--p)*1turn),rgba(255,255,255,.18) 0)}
  .res{position:fixed;inset:0;z-index:50;background:rgba(23,22,22,.94);overflow:auto}
</style>
<script src="cards/manifest.js"></script>
<script src="sim-browser.js"></script>
<script src="s5.js"></script>
</head><body>
<main class="s5" id="app"></main>
<div id="sim"></div>
<script>
const app = document.getElementById('app'), sim = document.getElementById('sim');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const H = `<div class="head"><img class="logo" src="/assets/logo.jpg" alt=""><div><h1>Scan Me <em>If You Can</em></h1><p class="tag">Station 5 · Scamurai</p></div></div>`;
// Board QR: c.html?n=<board number>. This Round's deal says which card is behind it.
const bn = parseInt(new URLSearchParams(location.search).get('n'), 10);
const r = S5.get() && S5.get().deal ? S5.get() : null;
const slug = r && r.deal[bn];
const m = slug ? { id: bn, slug } : (bn >= 1 && bn <= CARD_MANIFEST.length ? { id: bn } : null);
const say = html => { app.innerHTML = H + html; };

S5.flush(r);   // any Verdict an earlier scan could not deliver goes now

if (!m) say(`<div class="box">Unknown QR code.</div>`);
else if (!r) say(`<div class="box">This is QR <b>#${m.id}</b>. First scan the <b>Join QR</b> on the Station 5 laptop, then come back to this code.</div>
  <p class="muted">Already joined? Scan this code with the same phone camera you used for the Join QR (not WeChat or another app's scanner), so it opens in the same browser.</p>`);
else if (!r.cards.includes(m.id)) say(`<div class="box">QR <b>#${m.id}</b> isn't one of yours this round.<br><br>Find <b style="color:var(--yellow);font-size:26px">#${S5.next(r) || '—'}</b></div>`);
else if (r.done[m.id]) say(`<div class="box">You already judged QR <b>#${m.id}</b>.<br><br>${S5.next(r) ? `Next: find <b style="color:var(--yellow);font-size:26px">#${S5.next(r)}</b>` : 'All done: head back to the laptop.'}</div>`);
else {
  // The timer start is saved, so reloading or going back never gives a fresh 30 s (and a phone that slept keeps counting).
  const startedAt = () => ((S5.get() || r).started || {})[m.id];
  const leftAt = () => startedAt() ? S5.SECS - (Date.now() - startedAt()) / 1000 : S5.SECS;
  say(`<div class="box" style="text-align:center"><div class="big">#${m.id}</div>
    <p>Is this site <b>REAL</b> or <b>FAKE</b>?</p>
    <p class="muted">You get ${S5.SECS} seconds. Check the address bar, the padlock, where links really go (long-press them), and what the site asks for. Nothing you type is ever sent.</p></div>
    <button class="btn" id="go" disabled>Loading the site…</button><p class="muted" id="lerr" style="text-align:center"></p>`);
  const go = document.getElementById('go'), lerr = document.getElementById('lerr');
  const endedP = S5.ended(r);
  let card = null;
  // Download the whole site first: the 30 s start only once it can be shown at once, whatever its size.
  async function prepare() {
    go.disabled = true; go.textContent = 'Loading the site…'; lerr.textContent = '';
    try { card = await SimCards.load(slug); await SimCards.prefetch(card); }
    catch (e) { go.disabled = false; go.textContent = 'Try again'; go.onclick = prepare; lerr.textContent = `Could not load this site (${e.message}). Check your internet.`; return; }
    if (startedAt() && leftAt() <= 0) return start();   // came back after the time ran out: that counts as a timeout
    go.disabled = false;
    go.textContent = startedAt() ? `Continue · ${Math.max(1, Math.ceil(leftAt()))} s left` : 'Start the timer';
    go.onclick = start;
  }
  prepare();

  async function start() {
    go.disabled = true;
    const over0 = await endedP;
    if (over0 === 'gone') { try { localStorage.removeItem(S5.KEY); } catch {} return say(`<div class="box">This round is not on the server any more. Ask the Game Master for a new Join QR.</div>`); }
    if (over0) return say(`<div class="box">This round has ${over0 === 'cancelled' ? 'been cancelled' : 'ended'} at the laptop. Ask the Game Master for a new Join QR.</div>`);
    app.innerHTML = '';
    const bar = document.createElement('div');
    bar.className = 'vbar';
    bar.innerHTML = `<button class="real">REAL</button><div class="t"><b>${S5.SECS}</b></div><button class="fake">FAKE</button>`;
    let over = false, tick = null, fallback = null;
    const ring = bar.querySelector('.t'), num = ring.querySelector('b');
    ring.style.setProperty('--p', 1);
    function run() {   // the clock starts when the page is on screen (or after 5 s, whichever is first)
      if (tick || over) return;
      clearTimeout(fallback);
      const cur = S5.get() || r;
      if (!startedAt()) { cur.started = { ...(cur.started || {}), [m.id]: Date.now() }; S5.save(cur); r.started = cur.started; }
      const draw = () => {
        const left = Math.max(0, leftAt());
        ring.style.setProperty('--p', left / S5.SECS); num.textContent = Math.ceil(left);
        ring.classList.toggle('low', left <= 10);
        if (left <= 0) verdict('timeout');
      };
      document.body.appendChild(bar);   // REAL/FAKE appear with the clock, never before the page is there
      draw(); tick = setInterval(draw, 100);
    }
    if (startedAt() && leftAt() <= 0) return verdict('timeout');
    let b = null;
    b = SimBrowser(sim, card, { bottomInset: 84, onReady: () => run() });
    fallback = setTimeout(run, 5000);
    bar.querySelector('.real').onclick = () => verdict('real');
    bar.querySelector('.fake').onclick = () => verdict('fake');
    // The phone's own Back button (Android) works like the simulated one instead of leaving the card.
    history.pushState({ s5: 1 }, '');
    const onPop = () => { if (over) return; history.pushState({ s5: 1 }, ''); b && b.back(); };
    addEventListener('popstate', onPop);

    async function verdict(v) {
      if (over) return; over = true; clearInterval(tick); clearTimeout(fallback); removeEventListener('popstate', onPop);
      const ms = Math.min(S5.SECS * 1000, Math.max(0, Math.round(Date.now() - (startedAt() || Date.now()))));
      const correct = v !== 'timeout' && (v === 'real') === card.real;
      const pts = S5.points(correct, ms, v);
      const cur = S5.get() || r;
      cur.done[m.id] = { v, ms, correct, pts, sent: false };
      S5.save(cur);
      bar.remove(); b && b.close();
      const sent = S5.send(cur, m.id);
      const next = S5.next(cur);
      const missed = !card.real && !correct;
      const res = document.createElement('div'); res.className = 'res';
      res.innerHTML = `<main class="s5">${H}
        <div class="box" style="text-align:center">
          <div class="big" style="color:${correct ? '#7CFC8A' : 'var(--red)'}">${correct ? '✓ +' + pts : v === 'timeout' ? "Time's up · 0" : '✗ ' + pts}</div>
          <p>It was <b style="color:${card.real ? '#7CFC8A' : 'var(--red)'}">${card.real ? 'REAL' : 'FAKE'}</b> · ${esc(card.brand)}</p>
          <p class="muted" style="word-break:break-all">${esc(card.url)}</p></div>
        <div class="box"><b>${card.real ? 'Why it is genuine' : missed ? 'What you missed' : 'The tells'}</b>
          <ul class="tells">${(card.tells || []).map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
        <div class="box" style="text-align:center">${next ? `Next: find <span class="big" style="display:block;font-size:64px">#${next}</span>` : 'All done! Head back to the Station 5 laptop for your result.'}</div>
        <p class="muted" id="sent" style="text-align:center">Saving…</p></main>`;
      document.body.appendChild(res);
      const st = await sent;
      document.getElementById('sent').textContent = st === 'ok' ? 'Saved to the laptop ✓'
        : st === 'over' ? 'Not counted: this round has already ended at the laptop.'
        : 'No connection yet. Keep going: your answer is kept on this phone and sent with the next scan.';
    }
  }
}
</script>
</body></html>
