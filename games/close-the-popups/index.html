<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Close the Popups — Scamurai Station 2. Complete a web task while managing distracting ads.">
  <title>close the popups · Station 2</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="station.css">
  <!-- Loaded in the head: station.js registers dashboard mode before DOMContentLoaded boots the SDK. -->
  <script src="../../sdk.js" data-station="2"></script>
  <script defer src="station.js"></script>
</head>
<body>
  <button id="staff-toggle" aria-haspopup="dialog" aria-controls="station-header" aria-expanded="false">Staff</button>
  <dialog id="station-header" aria-labelledby="staff-title">
    <div class="station-panel-heading"><strong id="staff-title">Station 2 · Staff</strong><button id="staff-close" aria-label="Close staff menu">×</button></div>
    <span id="station-status" role="status" aria-live="polite">Connecting to Scamurai…</span>
    <nav aria-label="Station controls">
      <button id="retry" hidden>Retry save</button>
      <button id="resume" hidden>Resume task</button>
      <button id="personal" hidden>My scores</button>
      <button id="survey" hidden>Exit survey</button>
      <button id="next" hidden>Next participant</button>
      <button id="void" hidden>Cancel round</button>
      <button id="leaving" hidden>Leaving</button>
    </nav>
    <p id="personal-link" hidden></p>
  </dialog>
  <aside id="station-notice" role="alert" hidden><span id="notice-text"></span><button id="notice-action">Staff</button></aside>
  <iframe id="game" title="close the popups — 60-second challenge" allow="autoplay; fullscreen" hidden></iframe>
  <dialog id="cancel-dialog">
    <h2 id="cancel-title">Cancel this round?</h2>
    <p id="cancel-note">Use for equipment or loading problems. A cancelled round receives no score.</p>
    <button id="confirm-void">Cancel round</button>
    <button id="keep-playing">Keep playing</button>
  </dialog>
  <noscript>JavaScript is needed to connect this game to the scoreboard.</noscript>
</body>
</html>
