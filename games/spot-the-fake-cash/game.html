<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Spot the Fake Cash — Scamurai Station 1. Inspect ten banknotes under a UV torch and judge real or fake.">
  <title>Spot the Fake Cash · Scamurai Station 1</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <script>/* Load the demo answer key only for demo/standalone play; event rounds never ship answers to the browser. */
  if (new URLSearchParams(location.search).get('demo') === '1' || window.parent === window) {
    document.write('<script src="./js/demo-answers.js"><\/script>');
  }
  </script>
  <script defer src="./js/game-core.js"></script>
  <script defer src="./js/game.js"></script>
</head>
<body data-game="cash">
  <header class="hud" id="hud">
    <div class="hud-stats">
      <span class="stat" id="note-display">Note 1 / 10</span>
      <span class="stat time-box" id="time-display">02:00</span>
      <span class="stat" id="score-display">Score 0 / 100</span>
      <span class="stat" id="streak-display">Streak 0</span>
    </div>
    <div class="hud-tools">
      <button class="tool-btn" id="lang-btn" type="button" title="Switch language / 切换语言">中文</button>
      <button class="tool-btn" id="fullscreen-btn" type="button" aria-label="Enter fullscreen">⛶</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="note-frame" id="note-frame">
      <div class="note-pan-zoom" id="note-pan-zoom">
        <div class="note-flip" id="note-flip">
          <div class="note-surface" id="note-surface">
            <img class="note-day" id="note-day" alt="" draggable="false">
            <canvas class="note-uv" id="note-uv" aria-hidden="true"></canvas>
          </div>
        </div>
      </div>
      <canvas class="beam" id="beam" aria-hidden="true"></canvas>
    </div>

    <div class="feedback" id="feedback" role="status" hidden>
      <strong id="feedback-title"></strong>
      <span id="feedback-reason"></span>
    </div>

    <p class="status" id="status" role="status"></p>

    <div class="verdict-bar" id="action-bar" hidden>
      <div class="control-group">
        <button class="btn btn-uv" id="uv-btn" type="button" aria-pressed="true"><span id="uv-label">UV on</span> <kbd>Space</kbd></button>
        <button class="btn" id="flip-btn" type="button"><span data-i18n="flip"></span> <kbd>F</kbd></button>
        <div class="zoom-group" role="group" aria-label="Zoom">
          <button class="btn" id="zoom-out-btn" type="button" aria-label="Zoom out">−</button>
          <button class="btn" id="zoom-reset-btn" type="button"><span data-i18n="reset"></span></button>
          <button class="btn" id="zoom-in-btn" type="button" aria-label="Zoom in">+</button>
        </div>
      </div>
      <div class="verdict-group">
        <button class="btn btn-pass" id="pass-btn" type="button"><span data-i18n="pass"></span> <kbd>P / ←</kbd></button>
        <button class="btn btn-reject" id="reject-btn" type="button"><span data-i18n="reject"></span> <kbd>R / →</kbd></button>
      </div>
    </div>
  </main>

  <div class="overlay" id="start-overlay">
    <section class="panel" aria-labelledby="game-title">
      <p class="eyebrow">SCAMURAI · STATION 1</p>
      <h1 id="game-title">Spot the Fake Cash</h1>
      <p class="intro" data-i18n="intro"></p>
      <ol class="steps">
        <li data-i18n="step1"></li>
        <li data-i18n="step2"></li>
        <li data-i18n="step3"></li>
      </ol>
      <p class="asset-status" id="asset-status" hidden></p>
      <button class="btn btn-primary" id="start-game-btn" type="button" disabled><span data-i18n="start"></span></button>
    </section>
  </div>

  <div class="overlay" id="result-overlay" hidden>
    <section class="panel results-panel" aria-labelledby="result-title">
      <header class="results-head">
        <p class="eyebrow">SCAMURAI · STATION 1</p>
        <h2 id="result-title" tabindex="-1"></h2>
        <p class="result-score" id="result-score"></p>
        <p class="result-accuracy" id="result-accuracy"></p>
      </header>
      <div class="results-scroll">
        <h3 data-i18n="reviewHeading"></h3>
        <ol id="review-list"></ol>
      </div>
      <footer class="results-foot">
        <button class="btn btn-primary" id="again-btn" type="button"><span id="again-label"></span></button>
      </footer>
    </section>
  </div>

  <div id="error-panel" role="alert" hidden></div>
</body>
</html>
