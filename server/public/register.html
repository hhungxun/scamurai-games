<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Scamurai · Registration</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Lexend:wght@400;600&family=Permanent+Marker&display=swap">
<link rel="stylesheet" href="style.css">
</head><body><div class="wrap">
<div class="top"><img src="assets/logo.jpg" alt=""><div><h1>Scam<em>urai</em></h1><p class="tag">Front desk · registration</p></div></div>

<div class="card" id="pinCard" hidden>
  <h2>Secretary sign-in</h2>
  <label for="pin">Staff PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off">
  <p class="err" id="pinErr"></p><button class="wide" id="pinGo">Unlock</button>
</div>

<form class="card" id="form" hidden autocomplete="off">
  <h2>New participant</h2>
  <div class="chips" style="margin-top:8px">
    <label><input type="radio" name="kind" value="student" checked><span>XMUM student</span></label>
    <label><input type="radio" name="kind" value="guest"><span>Guest (no student ID)</span></label>
  </div>
  <div id="idRow"><label for="sid">Student ID</label><input id="sid" placeholder="e.g. PHY2209123" maxlength="20" style="text-transform:uppercase"></div>
  <label for="name">Name</label><input id="name" maxlength="80" placeholder="As they want it on the leaderboard (first name shown)">
  <label>Age group</label>
  <div class="chips">
    <label><input type="radio" name="age" value="≤18"><span>≤18</span></label>
    <label><input type="radio" name="age" value="19–21"><span>19–21</span></label>
    <label><input type="radio" name="age" value="22–25"><span>22–25</span></label>
    <label><input type="radio" name="age" value="26+"><span>26+</span></label>
  </div>
  <label>Do you have a Public Bank account?</label>
  <div class="chips">
    <label><input type="radio" name="pbb" value="yes"><span>Yes</span></label>
    <label><input type="radio" name="pbb" value="no"><span>No</span></label>
  </div>
  <label>Have you, or someone close to you, been targeted by a scam?</label>
  <div class="chips">
    <label><input type="radio" name="exp" value="yes-me"><span>Yes, me</span></label>
    <label><input type="radio" name="exp" value="yes-someone-close"><span>Someone close</span></label>
    <label><input type="radio" name="exp" value="no"><span>No</span></label>
    <label><input type="radio" name="exp" value="prefer-not-to-say"><span>Prefer not to say</span></label>
  </div>
  <label class="consent" style="margin-top:18px"><input type="checkbox" id="consent">
    <span>I agree that my answers and game scores are recorded for this event and the club's report. My name is shown on the leaderboard as first name + last 3 digits of my ID. Personal data is deleted within 30 days after 26 Nov 2026.</span></label>
  <p class="err" id="err"></p>
  <button class="wide" id="go" type="submit">Register</button>
  <p class="ok" id="ok"></p>
</form>

<div class="card" id="recent" hidden>
  <h2>Registered <span id="count" class="muted"></span></h2>
  <input id="search" placeholder="Search name or ID">
  <table><thead><tr><th>ID</th><th>Name</th><th>Stations</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table>
  <p class="muted" style="margin-top:14px"><a href="leaderboard.html" style="color:var(--yellow)">Leaderboard</a> ·
    <a href="#" id="lock" style="color:var(--grey)">Lock this device</a></p>
</div>
</div>
<script>
const $ = id => document.getElementById(id);
const KEY = 'scamurai.staffpin';
const pin = () => { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } };
const setPin = v => { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function api(path, opt = {}) {
  const r = await fetch(path, { method: opt.method || 'GET', headers: { 'Content-Type': 'application/json', 'X-Pin': pin() }, body: opt.body && JSON.stringify(opt.body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || r.statusText); e.status = r.status; throw e; }
  return j;
}
let list = [];
async function unlock() {
  try {
    const a = await api('/api/auth', { method: 'POST' });
    if (a.role === 'station') throw new Error('That is a Station PIN. Use the staff PIN.');
    $('pinCard').hidden = true; $('form').hidden = false; $('recent').hidden = false;
    refresh(); setInterval(refresh, 10000); $('sid').focus();
  } catch (e) { setPin(''); $('pinCard').hidden = false; $('pinErr').textContent = pin() || e.status !== 401 ? e.message : (e.message === 'Wrong PIN' && $('pin').value ? e.message : ''); }
}
$('pinGo').onclick = () => { setPin($('pin').value.trim()); unlock(); };
$('pin').onkeydown = e => { if (e.key === 'Enter') $('pinGo').click(); };
$('lock').onclick = e => { e.preventDefault(); setPin(''); location.reload(); };

const val = n => (document.querySelector(`input[name=${n}]:checked`) || {}).value;
document.querySelectorAll('input[name=kind]').forEach(r => r.onchange = () => { $('idRow').hidden = val('kind') === 'guest'; });
$('sid').oninput = () => {
  const id = $('sid').value.trim().toUpperCase(), hit = list.find(p => p.id === id);
  $('err').textContent = hit ? `${id} is already registered as ${hit.name}.` : '';
};
$('form').onsubmit = async e => {
  e.preventDefault(); $('err').textContent = ''; $('ok').textContent = '';
  const guest = val('kind') === 'guest';
  const body = { guest, id: $('sid').value, name: $('name').value, ageGroup: val('age'),
    pbbAccount: val('pbb') == null ? null : val('pbb') === 'yes', scamExposure: val('exp'), consent: $('consent').checked };
  if (!guest && !body.id.trim()) return $('err').textContent = 'Enter the student ID (or choose Guest).';
  $('go').disabled = true;
  try {
    const r = await api('/api/participants', { method: 'POST', body });
    $('ok').innerHTML = `✓ Registered <b>${esc(r.name)}</b> as <b style="color:var(--yellow);font-size:22px">${esc(r.id)}</b>. ${guest ? 'Write this Guest ID on their hand stamp/card. ' : ''}Off to any station!`;
    $('form').reset(); $('idRow').hidden = false; refresh(); $('sid').focus();
  } catch (e) { $('err').textContent = e.message; }
  $('go').disabled = false;
};
function render() {
  const t = $('search').value.trim().toUpperCase();
  const rows = list.filter(p => !t || p.id.includes(t) || p.name.toUpperCase().includes(t)).reverse();
  $('count').textContent = `(${list.length})`;
  $('rows').innerHTML = rows.slice(0, 50).map(p => `<tr><td>${esc(p.id)}</td><td>${esc(p.name)}</td><td>${p.stationsDone.length}/5</td><td>${esc(p.status)}${p.surveyDone ? ' ✓' : ''}</td></tr>`).join('');
}
$('search').oninput = render;
async function refresh() { try { list = await api('/api/participants'); render(); } catch (e) { if (e.status === 401) { setPin(''); location.reload(); } } }
if (pin()) unlock(); else $('pinCard').hidden = false;
</script>
</body></html>
