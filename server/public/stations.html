<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scamurai · Station QR codes</title><link rel="stylesheet" href="/style.css"><script src="/site.js" defer></script><script src="/vendor/qrcode.js"></script><style>.station-codes{display:grid;grid-template-columns:1fr 1fr;gap:20px}.station-code{background:var(--paper);color:var(--bg);padding:24px;text-align:center;break-inside:avoid;border:1px solid var(--dim)}.station-code svg{max-width:210px;display:block;margin:20px auto}.station-code h2{font-size:32px}.station-code p{font-size:12px}@media(max-width:560px){.station-codes{grid-template-columns:1fr}}@media print{@page{size:A4;margin:12mm}body{background:white;color:black}.wrap{padding:0;max-width:none}.print-tools{display:none}.station-codes{grid-template-columns:1fr 1fr;gap:8mm}.station-code{height:125mm;display:flex;flex-direction:column;align-items:center;justify-content:center}.station-code svg{width:55mm;height:55mm}}</style><link rel="icon" href="/assets/favicon.png" type="image/png"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"></head><body data-site-nav><main class="wrap" id="main-content"><div class="print-tools"><p class="eyebrow">STAFF / PRINT &amp; DISPLAY</p><h1>STATION QR CODES</h1><p>Participants open <b>Start Scamming</b> on their participant page and scan these codes. Stations 1, 2 and 3 direct participants to the game laptops. Station 5 explains how to join.</p><p><button onclick="print()">Print station codes</button> <a class="btn ghost" href="/games/scan-me-if-you-can/board.html">Game 5 board codes</a></p></div><div class="station-codes" id="codes"></div></main><script>
const base=['localhost','127.0.0.1'].includes(location.hostname)?'https://scamurai.physicsxmum.my':location.origin;
document.getElementById('codes').innerHTML=Array.from({length:5},(_,i)=>{const n=i+1,q=qrcode(0,'M');q.addData(`${base}/station.html?n=${n}`);q.make();return `<article class="station-code"><p class="eyebrow">SCAMURAI / XMUM</p><h2>STATION ${n}</h2>${q.createSvgTag({cellSize:6,margin:4,scalable:true})}<p>${n===1?'Spot the Fake Cash':n===2?'Close the Pop-ups':n===3?'Phishing Fishing':n===4?'Real or AI?':'Scan Me If You Can'}</p><p>Scan with Start Scamming on your participant page.</p></article>`}).join('');
</script></body></html>
