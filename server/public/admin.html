<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Scamurai · Admin</title>
<link rel="stylesheet" href="style.css">
<style>.wrap{max-width:900px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stats div{background:var(--surf);border-radius:12px;padding:12px}.stats b{display:block;font:32px Anton,sans-serif;color:var(--yellow)}</style>
<script src="/site.js" defer></script>
</head><body data-site-nav data-page="admin"><div class="wrap">
<div class="top"><img src="assets/logo.jpg" alt=""><div><h1>EVENT <em>CONTROL.</em></h1><p class="tag">Overview &amp; exports</p></div></div>
<div class="card" id="pinCard">
  <label for="pin">Admin PIN</label><input id="pin" type="password" autocomplete="off">
  <p class="err" id="err" role="alert"></p><button class="wide" id="go">Open</button>
</div>
<div id="main" hidden><div class="meta"><p id="adminConnection" class="muted" role="status"></p><button class="ghost" id="adminLock">Lock this device</button></div>
  <div class="card"><div class="stats" id="stats"></div></div>
  <div class="card"><h2>Per station</h2><table><tbody id="per"></tbody></table></div>
  <div class="card"><h2>Export (for the post-mortem)</h2>
    <p><a class="btn" id="csvP" href="#">participants.csv</a> <a class="btn" id="csvR" href="#">rounds.csv</a></p>
    <p class="muted">Delete personal data within 30 days after 26 Nov 2026 (stop the service and remove server/data/scamurai.db).</p></div>
  <div class="card"><h2>Participants</h2><label for="adminSearch">Find a participant</label><input id="adminSearch" placeholder="Search name or ID"><table><thead><tr><th>ID</th><th>Name</th><th>Status</th><th>Done</th><th>Total</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let PIN = '', poll = null, people = [];
async function load() {
  const r = await fetch('/api/admin/overview', { headers: { 'X-Pin': PIN } });
  const d = await r.json();
  if (!r.ok) throw Object.assign(new Error(d.error || r.statusText), {status:r.status});
  $('pinCard').hidden = true; $('main').hidden = false;
  $('stats').innerHTML = [['Registered', d.participants], ['Active', d.active], ['Abandoned', d.abandoned], ['Checked out', d.left], ['All 5 done', d.finishedAll]]
    .map(([k, v]) => `<div><b>${v}</b>${k}</div>`).join('');
  $('per').innerHTML = d.perStation.map(s => `<tr><td>${s.n}. ${esc(s.name)}</td><td>${s.players} players</td></tr>`).join('');
  people = d.rows; renderPeople(); $('adminConnection').textContent = 'Connected · scores update automatically';
  // Downloaded with the PIN in a header, so it never lands in browser history or the tunnel's access logs.
  const csv = name => async e => {
    e.preventDefault();
    const res = await fetch('/api/export/' + name, { headers: { 'X-Pin': PIN } });
    if (!res.ok) return alert('Download failed: ' + res.status);
    const a = document.createElement('a'); a.href = URL.createObjectURL(await res.blob()); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  };
  $('csvP').onclick = csv('participants.csv');
  $('csvR').onclick = csv('rounds.csv');
}
function renderPeople() {
  const find = $('adminSearch').value.trim().toUpperCase();
  const found = people.filter(p => !find || p.id.includes(find) || p.name.toUpperCase().includes(find));
  $('rows').innerHTML = found.map(p => `<tr><td>${esc(p.id)}</td><td>${esc(p.name)}</td><td>${esc(p.status)}</td><td>${p.done}/5</td><td>${p.total}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No matching participants.</td></tr>';
}
$('adminSearch').oninput = renderPeople;
$('adminLock').onclick = () => { clearInterval(poll); PIN = ''; $('pin').value = ''; $('main').hidden = true; $('pinCard').hidden = false; $('pin').focus(); };
$('go').onclick = async () => {
  if ($('go').disabled) return;
  $('go').disabled = true; $('err').textContent = ''; PIN = $('pin').value.trim();
  try {
    await load(); clearInterval(poll);
    poll = setInterval(() => load().catch(e => {
      $('adminConnection').textContent = 'Cannot refresh. Showing the last update; trying again shortly.';
      if (e.status === 401 || e.status === 403) { $('adminLock').click(); $('err').textContent = e.message; }
    }), 15000);
  } catch (e) { $('err').textContent = e.status ? e.message : 'Cannot connect. Check the Wi-Fi and try again.'; }
  finally { $('go').disabled = false; }
};
$('pin').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
</script>
</body></html>
